services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CORTEX_DOMAIN: ${CORTEX_DOMAIN:?CORTEX_DOMAIN is required}
    volumes:
      - ./docker/cortex/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - jupyterhub
      - cortex-gateway
    networks:
      - cortex-jupyter

  jupyterhub:
    build:
      context: ./docker/jupyterhub
    image: ${CORTEX_JUPYTERHUB_IMAGE:-cortex-jupyterhub:5.4.5}
    restart: unless-stopped
    environment:
      CORTEX_JUPYTERHUB_API_TOKEN: ${CORTEX_JUPYTERHUB_API_TOKEN:?CORTEX_JUPYTERHUB_API_TOKEN is required}
      JUPYTERHUB_NETWORK: cortex-jupyter
      JUPYTERHUB_SINGLEUSER_IMAGE: ${JUPYTERHUB_SINGLEUSER_IMAGE:-quay.io/jupyter/base-notebook:2025-09-08}
      JUPYTERHUB_DEFAULT_CPU_LIMIT: ${JUPYTERHUB_DEFAULT_CPU_LIMIT:-1}
      JUPYTERHUB_DEFAULT_MEMORY_LIMIT: ${JUPYTERHUB_DEFAULT_MEMORY_LIMIT:-2G}
      JUPYTERHUB_ALLOW_ALL: ${JUPYTERHUB_ALLOW_ALL:-false}
      JUPYTERHUB_AUTHENTICATOR_CLASS: ${JUPYTERHUB_AUTHENTICATOR_CLASS:-dummy}
    volumes:
      - jupyterhub-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cortex-jupyter

  cortex-gateway:
    build:
      context: .
      dockerfile: ./docker/cortex-gateway/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8787
      HUB_API_URL: http://jupyterhub:8000
      HUB_API_KEY: ${HUB_API_KEY:?HUB_API_KEY is required}
      CORTEX_PROXY_TICKET_SECRET: ${CORTEX_PROXY_TICKET_SECRET:?CORTEX_PROXY_TICKET_SECRET is required}
      CORTEX_ALLOWED_ORIGIN: ${CORTEX_ALLOWED_ORIGIN:?CORTEX_ALLOWED_ORIGIN is required}
    depends_on:
      - jupyterhub
    networks:
      - cortex-jupyter

networks:
  cortex-jupyter:
    name: cortex-jupyter

volumes:
  jupyterhub-data:
  caddy-data:
  caddy-config:
